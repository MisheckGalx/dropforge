<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <rect width="1400" height="620" fill="#ffffff"/>

  <!-- Label above the IAM-scoped arrow -->
  <text x="900" y="150" font-size="26" fill="#444444" text-anchor="middle">IAM scopes this identity to one bucket only</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Client box -->
  <rect x="60" y="220" width="260" height="150" rx="18" fill="#f0ece1" stroke="#e0dbcb" stroke-width="1.5"/>
  <text x="190" y="285" font-size="30" font-weight="700" fill="#333333" text-anchor="middle">Client</text>
  <text x="190" y="325" font-size="22" fill="#555555" text-anchor="middle">Browser upload UI</text>

  <!-- Arrow 1 -->
  <line x1="320" y1="295" x2="440" y2="295" stroke="#8a8a8a" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Backend box -->
  <rect x="450" y="220" width="300" height="150" rx="18" fill="#e3edfb" stroke="#c9dbf5" stroke-width="1.5"/>
  <text x="600" y="285" font-size="30" font-weight="700" fill="#1a4fa0" text-anchor="middle">FastAPI backend</text>
  <text x="600" y="325" font-size="22" fill="#3a6ac0" text-anchor="middle">Signs presigned URLs</text>

  <!-- Arrow 2 -->
  <line x1="750" y1="295" x2="870" y2="295" stroke="#8a8a8a" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- IAM box (branch, like CloudWatch in reference) -->
  <rect x="580" y="450" width="300" height="150" rx="18" fill="#f0ece1" stroke="#e0dbcb" stroke-width="1.5"/>
  <text x="730" y="515" font-size="28" font-weight="700" fill="#333333" text-anchor="middle">IAM</text>
  <text x="730" y="550" font-size="20" fill="#555555" text-anchor="middle">dropforge-app, scoped creds</text>

  <!-- Vertical arrow backend -> IAM -->
  <line x1="600" y1="370" x2="640" y2="448" stroke="#8a8a8a" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- S3 box -->
  <rect x="880" y="220" width="300" height="150" rx="18" fill="#e0f3ea" stroke="#c3e8d6" stroke-width="1.5"/>
  <text x="1030" y="285" font-size="30" font-weight="700" fill="#166c43" text-anchor="middle">Amazon S3</text>
  <text x="1030" y="325" font-size="22" fill="#2a8f5f" text-anchor="middle">Private bucket</text>

  <!-- Arrow S3 -> objects -->
  <line x1="1030" y1="370" x2="1030" y2="448" stroke="#8a8a8a" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Objects box -->
  <rect x="880" y="450" width="300" height="150" rx="18" fill="#fbe9e0" stroke="#f3d3c0" stroke-width="1.5"/>
  <text x="1030" y="515" font-size="28" font-weight="700" fill="#a3401a" text-anchor="middle">Objects</text>
  <text x="1030" y="550" font-size="20" fill="#c05a2e" text-anchor="middle">uploads/YYYY/MM/DD/</text>

  <!-- direct upload arrow, curved, from Client to S3 -->
  <path d="M 190 220 C 190 60, 1030 60, 1030 218" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowhead)"/>
  <text x="610" y="55" font-size="24" fill="#444444" text-anchor="middle">Direct upload — file bytes never touch the backend</text>
</svg>
