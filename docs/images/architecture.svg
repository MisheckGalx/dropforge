<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DropForge architecture</title>
<desc>Browser requests a presigned URL from the FastAPI backend, which uses scoped IAM credentials to sign it, then the browser uploads the file directly to S3.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="node c-gray">
<rect x="40" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="60" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts" x="120" y="80" text-anchor="middle" dominant-baseline="central">index.html</text>
</g>

<g class="node c-blue">
<rect x="260" y="40" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="350" y="60" text-anchor="middle" dominant-baseline="central">FastAPI backend</text>
<text class="ts" x="350" y="80" text-anchor="middle" dominant-baseline="central">main.py</text>
</g>

<g class="node c-purple">
<rect x="480" y="40" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="60" text-anchor="middle" dominant-baseline="central">IAM user</text>
<text class="ts" x="560" y="80" text-anchor="middle" dominant-baseline="central">dropforge-app</text>
</g>

<line x1="200" y1="68" x2="258" y2="68" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="229" y="52" text-anchor="middle">1. POST /upload-url</text>

<line x1="440" y1="68" x2="478" y2="68" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="459" y="52" text-anchor="middle">2. sign</text>

<g class="c-teal">
<rect x="180" y="200" width="320" height="220" rx="20" stroke-width="0.5"/>
<text class="th" x="200" y="230">Amazon S3</text>
<text class="ts" x="200" y="248">dropforge-mukanya-2026 (private)</text>
</g>

<g class="c-coral">
<rect x="210" y="280" width="260" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="302" text-anchor="middle" dominant-baseline="central">uploads/YYYY/MM/DD/</text>
<text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central">object stored by key</text>
</g>

<path d="M120 96 V150 Q120 170 160 170 H460 Q500 170 500 190" fill="none" stroke="var(--t)" stroke-width="0.5" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="164" text-anchor="middle">3. PUT / POST file bytes directly (presigned URL)</text>

<text class="ts" x="340" y="440" text-anchor="middle">File bytes never pass through the FastAPI server</text>
</svg>
