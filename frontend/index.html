<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DropForge</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --border-solid: #262b36;
    --accent: #ff6a3d; --accent-soft: #ff6a3d22; --text: #e8e9ec;
    --muted: #8b93a3; --success: #3ddc97; --error: #ff5470;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #1a1f2b 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--border-solid); border-radius: 16px; padding: 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  #drop { border: 1.5px dashed var(--border-solid); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  #drop.hover { border-color: var(--accent); background: var(--accent-soft); }
  #drop p { margin: 0; color: var(--muted); font-size: 14px; }
  #drop strong { color: var(--text); }
  input[type=file] { display: none; }
  .progress-wrap { margin-top: 20px; display: none; }
  .progress-bar-bg { background: #1c2029; border-radius: 8px; height: 8px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
  .status { margin-top: 12px; font-size: 13px; color: var(--muted); word-break: break-all; }
  .status.success { color: var(--success); }
  .status.error { color: var(--error); }
  .config { margin-top: 24px; font-size: 12px; color: var(--muted); }
  .config input { width: 100%; background: #0e1117; border: 1px solid var(--border-solid); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-top: 4px; }
  .filelist { margin-top: 28px; border-top: 1px solid var(--border-solid); padding-top: 20px; }
  .filelist h2 { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .file-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1e27; font-size: 13px; }
  .file-row:last-child { border-bottom: none; }
  .file-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
  .file-meta { color: var(--muted); font-size: 11px; }
  .file-actions a, .file-actions button { color: var(--muted); background: none; border: none; cursor: pointer; font-size: 12px; margin-left: 10px; text-decoration: none; }
  .file-actions button:hover { color: var(--error); }
  .file-actions a:hover { color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Drop<span>Forge</span></h1>
    <p class="sub">Files go straight to S3. Nothing passes through the server.</p>

    <div id="drop">
      <p><strong>Click to choose a file</strong> or drag one here</p>
      <p style="margin-top:6px;font-size:11px;">Max size: <span id="maxSizeLabel">checking...</span></p>
      <input type="file" id="fileInput" />
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div class="status" id="status"></div>
    </div>

    <div class="filelist">
      <h2>Uploaded files</h2>
      <div id="fileList"><div class="empty">Loading...</div></div>
    </div>

    <div class="config">
      Backend URL
      <input type="text" id="apiBase" value="http://localhost:8000" />
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const statusEl = document.getElementById('status');
const apiBaseInput = document.getElementById('apiBase');
const fileListEl = document.getElementById('fileList');
const maxSizeLabel = document.getElementById('maxSizeLabel');

function apiBase() { return apiBaseInput.value.replace(/\/$/, ''); }

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}

drop.addEventListener('click', () => fileInput.click());
['dragover', 'dragenter'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const file = e.dataTransfer.files[0]; if (file) uploadFile(file); });
fileInput.addEventListener('change', e => { const file = e.target.files[0]; if (file) uploadFile(file); });

async function uploadFile(file) {
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  setStatus(`Requesting upload slot for ${file.name}...`, '');
  try {
    const res = await fetch(`${apiBase()}/upload-url-post`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, content_type: file.type || 'application/octet-stream' })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Server responded ${res.status}`);
    }
    const { url, fields, max_size_bytes } = await res.json();

    if (file.size > max_size_bytes) {
      throw new Error(`File is ${formatBytes(file.size)}, limit is ${formatBytes(max_size_bytes)}`);
    }

    const formData = new FormData();
    Object.entries(fields).forEach(([k, v]) => formData.append(k, v));
    formData.append('file', file);

    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = pct + '%';
          setStatus(`Uploading... ${pct}%`, '');
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve();
        else reject(new Error(parseS3Error(xhr.responseText) || `Upload failed with status ${xhr.status}`));
      };
      xhr.onerror = () => reject(new Error('Network error during upload'));
      xhr.send(formData);
    });

    progressBar.style.width = '100%';
    setStatus(`Done uploading ${file.name}.`, 'success');
    loadFiles();
  } catch (err) {
    setStatus(`Error: ${err.message}`, 'error');
  }
}

function parseS3Error(xmlText) {
  try {
    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const code = doc.querySelector('Code')?.textContent;
    const message = doc.querySelector('Message')?.textContent;
    return code ? `${code}: ${message}` : null;
  } catch { return null; }
}

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }

async function loadFiles() {
  try {
    const res = await fetch(`${apiBase()}/files`);
    if (!res.ok) throw new Error('Could not load files');
    const { files } = await res.json();
    if (files.length === 0) {
      fileListEl.innerHTML = '<div class="empty">No files uploaded yet.</div>';
      return;
    }
    fileListEl.innerHTML = files.map(f => `
      <div class="file-row" data-key="${f.key}">
        <div>
          <div class="file-name">${f.key.split('/').pop()}</div>
          <div class="file-meta">${formatBytes(f.size_bytes)} · ${new Date(f.last_modified).toLocaleString()}</div>
        </div>
        <div class="file-actions">
          <a href="${f.url}" target="_blank">view</a>
          <button onclick="deleteFile('${f.key.replace(/'/g, "\\'")}')">delete</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    fileListEl.innerHTML = `<div class="empty">Error loading files: ${err.message}</div>`;
  }
}

async function deleteFile(key) {
  if (!confirm(`Delete ${key.split('/').pop()}?`)) return;
  try {
    const res = await fetch(`${apiBase()}/files/${key}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('Delete failed');
    loadFiles();
  } catch (err) {
    alert(`Error deleting file: ${err.message}`);
  }
}

async function loadMaxSize() {
  try {
    const res = await fetch(`${apiBase()}/upload-url-post`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: 'probe.txt', content_type: 'text/plain' })
    });
    const data = await res.json();
    maxSizeLabel.textContent = formatBytes(data.max_size_bytes);
  } catch {
    maxSizeLabel.textContent = 'unknown';
  }
}

loadFiles();
loadMaxSize();
</script>
</body>
</html>
